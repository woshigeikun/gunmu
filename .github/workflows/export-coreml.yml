name: export-coreml
# 在 GitHub 的 macOS runner 上把 models/best.pt 转成 Core ML(.mlmodelc)。
#
# 为什么要走 ONNX 中转:直接把 .pt 交给 coremltools 会失败 ——
#   ERROR - converting 'int' op (located at: '.../attn/...'):
#   TypeError: only 0-dimensional arrays can be converted to Python scalars
# YOLO11 注意力块里的 int() 无法被 TorchScript 前端降级。
# 先导 ONNX 再转 Core ML,可以绕开这个问题,而且输出布局 [1,84,8400]
# 正好是 App 解码器已支持的那种。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy<2.3" ultralytics onnx coremltools

      - name: 导出 ONNX(opset 13,兼容性最好)
        run: |
          cd models
          yolo export model=best.pt format=onnx imgsz=640 simplify=False opset=13
          echo "--- 产物 ---"
          ls -la

      - name: ONNX → Core ML
        run: |
          python - <<'PY'
          import coremltools as ct

          src = "models/best.onnx"
          m = ct.convert(
              src,
              convert_to="mlprogram",
              minimum_deployment_target=ct.target.iOS16,
          )
          out = "models/best.mlpackage"
          m.save(out)
          print("saved:", out)
          print("inputs:", m.get_spec().description.input)
              # 供日志核对输入名/形状,方便排查
          PY
          ls -la models

      - name: 编译为 mlmodelc
        run: |
          cd models
          xcrun coremlcompiler compile best.mlpackage out
          ls -la out

      - name: 打包并发布
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd models
          mkdir -p bundle
          cp -r out/*.mlmodelc bundle/
          cd bundle
          zip -r ../best-coreml.zip .
          cd ../..
          gh release view tools >/dev/null 2>&1 || gh release create tools \
            --title "导出产物" --notes "模型等转换产物"
          gh release upload tools models/best-coreml.zip --clobber
          echo "下载: https://github.com/${{ github.repository }}/releases/download/tools/best-coreml.zip"
