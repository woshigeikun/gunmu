name: build-ios
on:
  workflow_dispatch:        # 仓库页面手动点 Run workflow 触发

permissions:
  contents: write           # 发布 Release 需要写权限

jobs:
  build:
    runs-on: macos-15       # 最新 macOS 镜像,自带最新 Xcode(26)
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true        # 缓存 Flutter SDK 与 pub 缓存,缩短构建时间

      # camera_avfoundation 0.10.x 使用新版 AVCaptureSession 静态成员(如
      # .wasInterruptedNotification),必须用最新 Xcode 编译(见 flutter issue 185031)。
      # macos-15 镜像里可能有多个 Xcode,这里显式切到版本号最高的那个。
      - name: 使用最新版 Xcode
        run: |
          echo "可用的 Xcode:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "切换到(最新): $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "--- 当前 Xcode 版本 ---"
          xcodebuild -version

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign   # 先不打签名
      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/*.app Payload/
          zip -r app.ipa Payload
      # 不用 Actions 产物(upload-artifact):私有仓库只有 500MB 的 Actions 存储,
      # 产物+日志很容易撑满,一撑满连编译成功的构建也会在"上传产物"这一步失败。
      # 改为发布到 Release 附件:走仓库存储,不占 Actions 配额,也不会过期。
      - name: 发布 ipa 到 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-ios >/dev/null 2>&1 \
            || gh release create latest-ios \
                 --title "iOS 最新构建" \
                 --notes "由 GitHub Actions 自动构建;每次构建覆盖同名附件。"
          gh release upload latest-ios app.ipa --clobber
