name: build-ios
on:
  workflow_dispatch:        # 仓库页面手动点 Run workflow 触发

jobs:
  build:
    runs-on: macos-15       # 最新 macOS 镜像,自带最新 Xcode(26)
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      # camera_avfoundation 0.10.x 使用新版 AVCaptureSession 静态成员(如
      # .wasInterruptedNotification),必须用最新 Xcode 编译(见 flutter issue 185031)。
      # macos-15 镜像里可能有多个 Xcode,这里显式切到版本号最高的那个。
      - name: 使用最新版 Xcode
        run: |
          echo "可用的 Xcode:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "切换到(最新): $XCODE"
          sudo xcode-select -s "$XCODE"
          echo "--- 当前 Xcode 版本 ---"
          xcodebuild -version

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign   # 先不打签名
      - name: 打包成 ipa
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/*.app Payload/
          zip -r app.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: app-ipa, path: app.ipa }
